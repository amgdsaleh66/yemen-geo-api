services:
  - type: web
    name: yemen-geo-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: YEMEN_API_KEY
        value: "" # اتركه فارغاً أو ضع مفتاح حماية خاص بك